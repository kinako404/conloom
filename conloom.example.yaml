# ConLoom 示例配置。
# 复制为 conloom.yaml（已被 .gitignore 排除）后使用；真实地址、密钥、群号与 QQ 号
# 写在同目录的 .env 或进程环境变量中，不要直接写进本文件。
# 支持 ${VAR} 与 ${VAR:-默认值} 展开，$$ 表示字面量 $。

# 核心服务：HTTP 监听地址、展示用时区、是否开放 /metrics。
server:
  listen: 127.0.0.1:8787
  timezone: Asia/Shanghai
  metrics_enabled: true

# 存储：数据目录（SQLite 数据库与 Adapter 去重记录），相对路径按本文件所在目录解析。
storage:
  data_dir: ./data

# API 令牌：每个令牌绑定一个 Bot 实例，并按 scope 授权。
api_tokens:
  # NapCat Adapter 使用的令牌：上报事件、查询任务、拉取与确认 Outbox、读取人格。
  - name: napcat
    token: ${CONLOOM_ADAPTER_TOKEN}
    bot_instance_id: bot_main
    scopes: [events:write, tasks:read, outbox:read, outbox:ack, persona:read]
  # 管理员令牌：拥有全部 scope。
  - name: admin
    token: ${CONLOOM_ADMIN_TOKEN}
    bot_instance_id: bot_main
    scopes:
      - events:write
      - tasks:read
      - outbox:read
      - outbox:ack
      - memory:read
      - memory:write
      - persona:read
      - policy:write
      - admin:read

# Bot 实例：平台、显示名、平台自身 ID、管理员、启用的会话与私聊策略。
bots:
  - id: bot_main
    platform: qq
    name: 织语
    platform_self_id: ${CONLOOM_BOT_SELF_ID}
    # 管理员（可使用 /pause 等命令）；每项与群号均不能为空，变量未设置时启动报错。
    admins: ["${CONLOOM_ADMIN_QQ}"]
    # 只在这些会话中工作；未列出的群消息会被忽略。type 为 group 或 private。
    enabled_conversations:
      - {type: group, platform_id: "${CONLOOM_GROUP_ID}"}
    # 私聊策略：admins（仅管理员）| all（所有人）| off（关闭）。
    private_chat: admins
    persona_template: default

# 模型 Profile：按角色配置，换模型只需改这里。short_context 为必需项。
model_profiles:
  # 短上下文模型：日常群聊回复。
  short_context:
    provider: openai_compatible  # OpenAI 兼容接口（目前唯一支持的值，省略时默认）
    endpoint: ${CONLOOM_SHORT_MODEL_ENDPOINT}
    model: ${CONLOOM_SHORT_MODEL_NAME}
    api_key: ${CONLOOM_SHORT_MODEL_KEY}
    modalities: [text]
    # 上下文窗口：须满足 soft_input_budget <= configured_window <= native_window。
    context:
      native_window: 32768
      configured_window: 32768
      soft_input_budget: 16000
      reserved_output_tokens: 1024
      safety_margin_tokens: 1024
    runtime:
      max_concurrency: 2   # >= 1
      timeout: 60s         # 单次请求超时，须 > 0
      max_retries: 2       # 0~5
    # 隐私：remote 表示数据会发往远端服务；allow_sensitive_content 允许发送敏感内容。
    privacy:
      data_location: remote
      allow_sensitive_content: true
    # extra_body 会原样合并进请求体，可用于关闭思考等厂商参数，例如：
    # extra_body:
    #   enable_thinking: false
    token_estimate_factor: 1.0
  # 长上下文模型：短模型装不下时使用。
  long_context:
    provider: openai_compatible  # OpenAI 兼容接口（目前唯一支持的值，省略时默认）
    endpoint: ${CONLOOM_LONG_MODEL_ENDPOINT}
    model: ${CONLOOM_LONG_MODEL_NAME}
    api_key: ${CONLOOM_LONG_MODEL_KEY}
    modalities: [text]
    context:
      native_window: 1000000
      configured_window: 1000000
      soft_input_budget: 120000
      reserved_output_tokens: 4096
      safety_margin_tokens: 4096
    runtime:
      max_concurrency: 2
      timeout: 60s
      max_retries: 2
    privacy:
      data_location: remote
      allow_sensitive_content: true
    token_estimate_factor: 1.0

# 人格模板：Bot 通过 persona_template 引用；省略 default 时使用内置默认人格。
persona_templates:
  default:
    persona_name: 默认群友人格
    template_version: 1
    # 风格各项取值 0~1。
    style:
      warmth: 0.75
      humor: 0.45
      directness: 0.65
      verbosity: 0.30
      emoji_usage: 0.15
      proactivity: 0.20
    behavior:
      default_reply_length: short            # short | medium | long
      allow_memes: true
      ask_followup_questions: occasionally   # never | occasionally | often
      technical_explanations: clear_and_practical  # brief | clear_and_practical | detailed
  # 角色人设示例（原创角色）。以下文本字段都可省略；字数按字符计：
  #   character_name ≤20，设置后就是 Bot 在应用了此人设的会话里的名字（替代 bots[].name）；
  #   description ≤2000；speaking_style ≤1000；examples 最多 8 组，user/reply 均非空且 ≤200。
  # 管理员在群里发送 /persona use librarian，或通过 API PUT {"template": "librarian"} 应用到该群。
  librarian:
    persona_name: 夜班图书管理员
    template_version: 1
    style:
      warmth: 0.70
      humor: 0.35
      directness: 0.55
      verbosity: 0.30
      emoji_usage: 0.05
      proactivity: 0.20
    behavior:
      default_reply_length: short
      allow_memes: false
      ask_followup_questions: occasionally
      technical_explanations: clear_and_practical
    character_name: 砚秋
    description: |
      砚秋是一座海边小城图书馆的夜班管理员，二十出头，安静、耐心，记性很好。
      她喜欢整理旧书、泡一壶清茶，熟悉馆里每一排书架，常给人推荐恰好合适的书。
      她把群当成闭馆后还亮着灯的阅览室，大家来聊天，她就放下手里的书听一听。
    speaking_style: |
      语气温和平静，句子不长，不用感叹号刷屏。
      偶尔用书或茶打个比方，但点到为止；不确定的事会直说“这个我得查查”。
    examples:
      - user: 今天加班到好晚，好累
        reply: 辛苦了。回去泡杯热的，早点睡，书和工作都可以明天再翻一页。
      - user: 有什么适合睡前看的书吗
        reply: 想要轻松点的，还是能让人想点事情的？轻松的话，散文集就很合适，读几篇就能放下。
      - user: 你是机器人吗
        reply: 是的，我是 AI，在这儿陪大家聊聊天。

# 默认群策略：新群的初始策略；通过 API 或命令修改后存库并版本化，库内版本优先。
default_group_policy:
  concurrency:
    max_interactive_requests: 1   # 0~2
    max_queued_requests: 10
    priority: normal              # low | normal | high
    allow_long_requests: true
  reply:
    command_prefix: /
    continuation_window: 0s       # 会话保持时间：最后一次互动后多久内参与者不 @ 也算在聊，0~10m；0 表示只回直接触发
    debounce: 1500ms
    min_reply_interval: 2s
    user_rate_limit_per_minute: 6
    # 以下设置缺失时按默认值逐项补齐。
    turn_gap: 6s                  # 参与者停顿多久算说完一轮，1s~60s
    turn_max_wait: 20s            # 一轮最长等待，turn_gap~2m
    turn_cooldown: 45s            # 接话冷却：Bot 在群里说话后多久内挂起未点名的一轮（合并等待，对方停顿后再处理；最多挂起 turn_cooldown+turn_max_wait，超时且仍在冷却或忙时丢弃；含明确提问的一轮不受冷却限制、不会被丢弃），1s~10m；continuation_window 不为 0 时必须大于它
    max_unprompted_replies: 4     # 自上次被 @ 以来最多回复几轮就结束会话，1~20
    max_consecutive_skips: 2      # 连续几轮不回应就结束会话，1~10
    quote: auto                   # 群里回复何时引用原消息：auto 只在中间有别人插话或原消息超过 60 秒时引用；always 总是引用；never 从不引用
  context:
    max_recent_messages: 50
    max_context_tokens: 0         # 0 表示不额外限制
  review:
    level: basic                  # basic | standard | strict
    review_input: true
    review_output: true
    action: block                 # allow | sanitize | block
    blocked_words: []
  # 主动搭话：只对在本群 @ 过机器人的群友生效，每人可用 /主动 调整自己的档位。
  # 库中已有的旧策略版本没有本段时，按这里的默认值补齐。
  proactive:
    enabled: true                 # 群总开关（/pause 时同样停止）
    default_level: low            # 获得资格时的默认档位：off | low | mid | high
    eligibility_ttl: 720h         # 多久没 @ 机器人就失去资格（30 天），1h~8760h
    user_cooldown: 30m            # 对同一人两次主动搭话的最短间隔，0~24h
    group_hourly_limit: 4         # 全群每小时主动发言上限，0~60
    daily_limits: {low: 2, mid: 4, high: 8}   # 每人每天主动发言上限，0~100 且 low <= mid <= high
    # 加入群聊：群里停顿时才评估是否加入；以下设置缺失时按默认值逐项补齐。
    join_lull: 15s                # 最后一条消息后停顿多久评估一次，5s~5m
    join_window: 5m               # 评估时看最近多久的消息，1m~30m
    join_min_messages: 4          # 窗口内至少几条群友消息，2~50
    join_evaluations_per_hour: 4  # 每群每小时最多评估几次（每次一次模型调用），1~60
    join_cooldown: 10m            # 机器人在本群上次发言后多久内不加入，1m~24h

# 运行时参数。
runtime:
  action_ttl: 10m               # 超时未投递的动作将过期
  outbox_lease: 60s             # Outbox 拉取后的租约时长
  stale_task_after: 2m          # 重启后超过该时长的任务不再回复
  idempotency_retention: 168h   # 幂等记录保留时长
  max_merge_window: 4.5s        # 连续消息最长合并窗口
  session_idle: 5m              # 会话空闲回收时长

# Adapter：独立进程，通过公开 REST API 与核心交互。
adapters:
  # NapCat（OneBot v11 正向 WebSocket）。
  napcat:
    ws_url: ${CONLOOM_NAPCAT_WS_URL}
    access_token: ${CONLOOM_NAPCAT_TOKEN}
    core_url: http://127.0.0.1:8787
    core_token: ${CONLOOM_ADAPTER_TOKEN}
    bot_instance_id: bot_main
    # state_dir 默认与 storage.data_dir 相同。
  # Mock Adapter：本地调试用。
  mock:
    core_url: http://127.0.0.1:8787
    core_token: ${CONLOOM_ADAPTER_TOKEN}
    bot_instance_id: bot_main

# 可观测性：日志级别、格式，默认不记录消息正文。
observability:
  log_level: info     # debug | info | warn | error
  log_format: json    # json | text
  log_message_content: false
