# ConLoom 示例配置。
# 复制为 conloom.yaml（已被 .gitignore 排除）后使用；真实地址、密钥、群号与 QQ 号
# 写在同目录的 .env 或进程环境变量中，不要直接写进本文件。
# 支持 ${VAR} 与 ${VAR:-默认值} 展开，$$ 表示字面量 $。

# 核心服务：HTTP 监听地址、展示用时区、是否开放 /metrics。
server:
  listen: 127.0.0.1:8787
  timezone: Asia/Shanghai
  metrics_enabled: true

# 存储：数据目录（SQLite 数据库与 Adapter 去重记录），相对路径按本文件所在目录解析。
storage:
  data_dir: ./data

# API 令牌：每个令牌绑定一个 Bot 实例，并按 scope 授权。
api_tokens:
  # NapCat Adapter 使用的令牌：上报事件、查询任务、拉取与确认 Outbox、读取人格。
  - name: napcat
    token: ${CONLOOM_ADAPTER_TOKEN}
    bot_instance_id: bot_main
    scopes: [events:write, tasks:read, outbox:read, outbox:ack, persona:read]
  # ---- Telegram 示例开始：使用 Telegram 时取消注释下面几行，并在 .env 里设置 CONLOOM_TG_* 变量（见 docs/telegram.md）----
  # - name: telegram    # Telegram Adapter 使用的令牌：scope 与 NapCat 的相同，绑定 bot_tg
  #   token: ${CONLOOM_TG_ADAPTER_TOKEN}
  #   bot_instance_id: bot_tg
  #   scopes: [events:write, tasks:read, outbox:read, outbox:ack, persona:read]
  # ---- Telegram 示例结束 ----
  # 管理员令牌：拥有全部 scope。
  - name: admin
    token: ${CONLOOM_ADMIN_TOKEN}
    bot_instance_id: bot_main
    scopes:
      - events:write
      - tasks:read
      - outbox:read
      - outbox:ack
      - memory:read
      - memory:write
      - persona:read
      - policy:write
      - admin:read

# Bot 实例：这里只写身份——ID、平台和平台自身 ID（Bot 自己在平台上的账号）。
# 显示名、管理员、私聊开放范围与白名单、启用的群、私聊和群聊的默认人设模板、技能
# 存在数据库里，在 Web 管理面板的聊天页编辑（见 docs/panel.md）。新加的 bot 先用默认值：
# 显示名取 ID，没有管理员，私聊只对管理员开放，没有启用的群，模板都用 default，不开技能。
bots:
  - id: bot_main
    platform: qq
    platform_self_id: ${CONLOOM_BOT_SELF_ID}
  # Telegram 机器人：platform_self_id 是 Bot 的数字 ID（token 冒号前的部分）。
  # 管理员、启用的群（Telegram 的群 ID 是负数）和私聊白名单同样在面板里设置。
  # ---- Telegram 示例开始：使用 Telegram 时取消注释下面几行，并在 .env 里设置 CONLOOM_TG_* 变量（见 docs/telegram.md）----
  # - id: bot_tg
  #   platform: telegram
  #   platform_self_id: ${CONLOOM_TG_BOT_ID}
  # ---- Telegram 示例结束 ----

# 模型 Profile：按角色配置，换模型只需改这里。short_context 为必需项。
model_profiles:
  # 短上下文模型：日常群聊回复。
  short_context:
    provider: openai_compatible  # OpenAI 兼容接口（目前唯一支持的值，省略时默认）
    endpoint: ${CONLOOM_SHORT_MODEL_ENDPOINT}
    model: ${CONLOOM_SHORT_MODEL_NAME}
    api_key: ${CONLOOM_SHORT_MODEL_KEY}
    # 模型支持的输入模态。含 image 时，回复请求会附带人设的外观参考图（appearance_image）的缩小图；
    # 确认模型确实接受图片后再改成 [text, image]，否则带图的回复会失败。
    modalities: [text]
    # 上下文窗口：须满足 soft_input_budget <= configured_window <= native_window，
    # 且 reserved_output_tokens + safety_margin_tokens < configured_window。
    context:
      native_window: 32768
      configured_window: 32768
      soft_input_budget: 16000
      reserved_output_tokens: 1024
      safety_margin_tokens: 1024
    runtime:
      max_concurrency: 2   # >= 1
      timeout: 60s         # 单次请求超时，须 > 0
      max_retries: 2       # 0~5
    # 隐私：remote 表示数据会发往远端服务；allow_sensitive_content 允许发送敏感内容。
    privacy:
      data_location: remote
      allow_sensitive_content: true
    # extra_body 会原样合并进请求体，可用于关闭思考等厂商参数，例如：
    # extra_body:
    #   enable_thinking: false
    token_estimate_factor: 1.0
  # 长上下文模型：短模型装不下时使用。
  long_context:
    provider: openai_compatible  # OpenAI 兼容接口（目前唯一支持的值，省略时默认）
    endpoint: ${CONLOOM_LONG_MODEL_ENDPOINT}
    model: ${CONLOOM_LONG_MODEL_NAME}
    api_key: ${CONLOOM_LONG_MODEL_KEY}
    modalities: [text]
    context:
      native_window: 1000000
      configured_window: 1000000
      soft_input_budget: 120000
      reserved_output_tokens: 8192   # 记忆整理的输出也用它：默认的私聊 3000 字摘要加笔记需要 8192 以上
      safety_margin_tokens: 4096
    runtime:
      max_concurrency: 2
      timeout: 60s
      max_retries: 2
    privacy:
      data_location: remote
      allow_sensitive_content: true
    token_estimate_factor: 1.0
  # 识图模型（可选）：只用于面板里根据外观参考图“生成外观介绍”，回复永远不会路由到它。
  # modalities 必须包含 image；reserved_output_tokens 作为 max_tokens，推理模型的思考也算在内。
  # 省略时生成外观介绍提示“未配置识图模型”。见 docs/deployment.md 的“人设参考图和识图模型”。
  # vision:
  #   endpoint: ${CONLOOM_LONG_MODEL_ENDPOINT}
  #   model: <支持图片输入的模型名>
  #   api_key: ${CONLOOM_LONG_MODEL_KEY}
  #   modalities: [text, image]
  #   context:
  #     native_window: 131072
  #     configured_window: 131072
  #     soft_input_budget: 16000
  #     reserved_output_tokens: 4096
  #     safety_margin_tokens: 1024
  #   runtime:
  #     max_concurrency: 1
  #     timeout: 40s
  #     max_retries: 1
  #   privacy:
  #     data_location: remote
  #     allow_sensitive_content: true

# 技能：内置技能 memory、time、status、buff 打包在程序里。dir 可选，相对路径按本文件所在目录解析；
# 目录里每个 <名字>/SKILL.md 与内置技能同名时替换它，否则作为新技能加入（格式见 docs/skills.md）。
# skills:
#   dir: ./skills

# 语义检索（可选）：OpenAI 兼容的向量服务，请求发往 <endpoint>/embeddings。整段省略时只用关键词检索。
# 后台每分钟为记忆已生效的会话生成一批向量；改 model 后会全部重新生成。部署方式见 docs/deployment.md 的“向量服务”。
# embedding:
#   endpoint: http://127.0.0.1:11434/v1
#   model: bge-m3
#   api_key: ${CONLOOM_EMBEDDING_KEY:-}
#   timeout: 10s
#   batch_size: 16
#   min_score: 0.48             # 语义命中的最低余弦相似度，0~1。按 bge-m3 实测校准：相关的约 0.50–0.63，不相关的大多低于 0.46；换模型后要重新校准

# Web 管理面板（可选）：开启后在核心服务的 /panel/ 提供，整段省略时不开放。
# 密码只存哈希：用 `conloom panel hash-password < password.txt` 生成，写进 .env 的 CONLOOM_PANEL_ADMIN_HASH。
# panel:
#   users:
#     - name: admin
#       password_hash: ${CONLOOM_PANEL_ADMIN_HASH}
#   session_ttl: 168h           # 登录后最长有效期
#   idle_timeout: 12h           # 多久没有操作就需要重新登录
#   cookie_secure: false        # 通过 HTTPS 访问时设为 true
#   listen: 0.0.0.0:8788        # 可选：面板单独的端口（只有面板，API 和 /metrics 仍只在 server.listen）。
#                               # 普通 HTTP 下密码和 cookie 明文传输，公网访问请加 HTTPS 反代或防火墙，见 docs/panel.md

# default_group_policy、default_private_policy 已搬到面板的设置页；旧文件第一次启动时会自动导入，之后要删掉这两段。

# 运行时参数。
runtime:
  action_ttl: 10m               # 超时未投递的动作将过期
  outbox_lease: 60s             # Outbox 拉取后的租约时长
  stale_task_after: 2m          # 重启后超过该时长的任务不再回复
  idempotency_retention: 168h   # 幂等记录保留时长
  max_merge_window: 4.5s        # 连续消息最长合并窗口
  session_idle: 5m              # 会话空闲回收时长
  # 流水表清理（每小时一次，分批删除）。聊天消息、记忆、群策略和人格版本永不清理。
  ops_retention: 720h           # 已结束的任务及其已确认/已过期/已取消的发件箱动作保留时长，24h~8760h；至少保留到 idempotency_retention
  audit_retention: 2160h        # 审计记录保留时长，24h~87600h
  usage_retention: 9600h        # 模型调用用量记录保留时长（400 天），面板的用量统计最多查 400 天

# Adapter：独立进程，通过公开 REST API 与核心交互。
adapters:
  # NapCat（OneBot v11 正向 WebSocket）。
  napcat:
    ws_url: ${CONLOOM_NAPCAT_WS_URL}
    access_token: ${CONLOOM_NAPCAT_TOKEN}
    core_url: http://127.0.0.1:8787
    core_token: ${CONLOOM_ADAPTER_TOKEN}
    bot_instance_id: bot_main
    # state_dir 默认与 storage.data_dir 相同。
  # Telegram（Bot API 长轮询，私聊和群聊；频道跳过）。只有 conloom adapter telegram 会校验这一段，
  # 不用 Telegram 时变量留空即可。
  telegram:
    token: ${CONLOOM_TG_BOT_TOKEN}       # BotFather 给的 token，只放在 .env 里
    api_base: https://api.telegram.org   # 可省略
    poll_timeout: 50s                    # getUpdates 长轮询时长，1s~60s
    core_url: http://127.0.0.1:8787
    core_token: ${CONLOOM_TG_ADAPTER_TOKEN}
    bot_instance_id: bot_tg
    # state_dir 默认与 storage.data_dir 相同。
  # Mock Adapter：本地调试用。
  mock:
    core_url: http://127.0.0.1:8787
    core_token: ${CONLOOM_ADAPTER_TOKEN}
    bot_instance_id: bot_main

# 可观测性：日志级别、格式，默认不记录消息正文。
observability:
  log_level: info     # debug | info | warn | error
  log_format: json    # json | text
  log_message_content: false
